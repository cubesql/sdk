# Costruisce ed esegue la suite su Windows, x64 e Win32.
#
# Prima non esisteva alcuna CI, e su Windows girava un solo test: gli altri
# erano raggiungibili solo dal Makefile POSIX e quindi non venivano mai
# compilati proprio sulla piattaforma che il driver ha come unico bersaglio.
name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    steps:
      - uses: actions/checkout@v4

      - name: Avvia il server CubeSQL
        shell: pwsh
        run: |
          # I test che parlano con un server hanno bisogno che sia in ascolto
          # sulla 4430. Sostituire con il modo in cui l'organizzazione mette a
          # disposizione un'istanza (servizio, container, macchina dedicata).
          Write-Host "Atteso un server CubeSQL su 127.0.0.1:4430"
          $ok = Test-NetConnection -ComputerName 127.0.0.1 -Port 4430 -InformationLevel Quiet
          if (-not $ok) {
            Write-Host "::warning::Nessun server sulla 4430: i test che ne hanno bisogno si fermeranno subito"
          }

      - name: Configura
        shell: pwsh
        run: |
          cmake -S ODBC -B build-${{ matrix.arch }} -A ${{ matrix.arch }} `
            -DBUILD_TESTING=ON -DCUBESQL_ODBC_WITH_TLS=ON

      - name: Compila
        shell: pwsh
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Controlla la risorsa di versione
        shell: pwsh
        run: |
          # L'architettura dichiarata nella risorsa deve corrispondere al binario:
          # rc.exe non definisce _WIN64, quindi ogni build si e' gia' descritta
          # una volta come "(32-bit)". Il controllo costa nulla e non torna.
          $dll = "build-${{ matrix.arch }}\Release\cubesqlodbc.dll"
          $vi = (Get-Item $dll).VersionInfo
          Write-Host "FileVersion=$($vi.FileVersion) Company=$($vi.CompanyName) Desc=$($vi.FileDescription)"
          $atteso = if ("${{ matrix.arch }}" -eq "x64") { "(64-bit)" } else { "(32-bit)" }
          if ($vi.FileDescription -notlike "*$atteso*") {
            throw "La risorsa di versione dice '$($vi.FileDescription)', atteso $atteso"
          }
          if (-not $vi.CompanyName) { throw "CompanyName vuoto" }
          if ($vi.FileVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "FileVersion malformata" }

      - name: Controlla che gli script girino su Windows PowerShell 5.1
        shell: powershell
        run: |
          # Windows PowerShell 5.1 non conosce [ushort]: gli script sono gia'
          # morti una volta prima di scrivere qualunque cosa. Qui si verifica
          # solo che si carichino, senza toccare il registro.
          $ErrorActionPreference = "Stop"
          foreach ($s in @("ODBC\windows\install.ps1","ODBC\windows\uninstall.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { throw "$s non passa il parser di PowerShell 5.1" }
            $txt = Get-Content $s -Raw
            if ($txt -match '\[ushort\]') { throw "$s usa [ushort], che non esiste in Windows PowerShell 5.1" }
          }
          Write-Host "script compatibili con Windows PowerShell 5.1"

      - name: Esegui la suite
        shell: pwsh
        working-directory: build-${{ matrix.arch }}
        run: ctest -C Release --output-on-failure --no-tests=error

      - name: Salva i log in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.arch }}
          path: build-${{ matrix.arch }}/Testing/**
