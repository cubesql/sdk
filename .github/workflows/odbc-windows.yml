name: ODBC Windows

on:
  push:
    branches:
      - "**"
    tags:
      - "odbc-v*"
    paths:
      - ".github/workflows/odbc-windows.yml"
      - "C_SDK/**"
      - "ODBC/**"
      - "libs/win-32bit/**"
      - "libs/win-64bit/**"
  pull_request:
    paths:
      - ".github/workflows/odbc-windows.yml"
      - "C_SDK/**"
      - "ODBC/**"
      - "libs/win-32bit/**"
      - "libs/win-64bit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Windows ${{ matrix.name }} Driver Manager smoke test
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            cmake_arch: Win32
            build_dir: build/odbc-win32
            registry_arch: "32"
            server_url: https://www.sqlabs.com/download/cubesql/590/cubeSQL_Windows32bit_Setup.msi
            server_sha256: 58108d31f39e9b6bc2249cada96d632bbbc90e759e24cc73afeb2050605138a8
          - name: x64
            cmake_arch: x64
            build_dir: build/odbc-win64
            registry_arch: "64"
            server_url: https://www.sqlabs.com/download/cubesql/590/cubeSQL_Windows64bit_Setup.msi
            server_sha256: 50ed86b40bc64ff7a2a87d4f845e130138f0ca8f7c1086a380c5431daa749b66
    env:
      CUBESQL_ODBC_CONNECTION_STRING: DRIVER={CubeSQL ODBC Driver};SERVER=127.0.0.1;PORT=4430;UID=admin;PWD=admin;ENCRYPTION=NONE;TIMEOUT=12;
      CUBESQL_ODBC_REGISTER_TEST_SERVER: "1"

    steps:
      - name: Check out SDK
        uses: actions/checkout@v6

      - name: Configure MSVC ${{ matrix.cmake_arch }} build
        run: >-
          cmake -S ODBC -B "${{ matrix.build_dir }}"
          -A "${{ matrix.cmake_arch }}"
          -DBUILD_TESTING=ON
          -DCUBESQL_ODBC_WITH_TLS=ON

      - name: Build driver and smoke test
        run: cmake --build "${{ matrix.build_dir }}" --config Release --parallel

      - name: Download and install CubeSQL server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:RUNNER_TEMP "cubesql-${{ matrix.name }}.msi"
          $install = Join-Path $env:RUNNER_TEMP "cubesql-${{ matrix.name }}-server"
          $msiLog = Join-Path $env:RUNNER_TEMP "cubesql-${{ matrix.name }}-msi.log"

          Invoke-WebRequest -Uri "${{ matrix.server_url }}" -OutFile $msi
          $actualHash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ matrix.server_sha256 }}") {
              throw "CubeSQL MSI SHA-256 mismatch: $actualHash"
          }

          New-Item -ItemType Directory -Force -Path $install | Out-Null
          $msiArgs = @("/i", $msi, "/qn", "/norestart", "APPDIR=$install", "/l*v", $msiLog)
          $result = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          if ($result.ExitCode -notin @(0, 3010)) {
              Get-Content $msiLog -Tail 100
              throw "CubeSQL MSI installation failed with exit $($result.ExitCode)"
          }

          "CUBESQL_SERVER_MSI=$msi" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CUBESQL_SERVER_MSI_LOG=$msiLog" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $service = Get-Service -Name "cubesql.exe" -ErrorAction SilentlyContinue
          if (-not $service) {
              Get-Content $msiLog -Tail 100
              throw "CubeSQL MSI did not register the cubesql.exe service"
          }

      - name: Register ${{ matrix.name }} ODBC driver
        shell: pwsh
        run: |
          $driver = Resolve-Path "${{ matrix.build_dir }}/Release/cubesqlodbc.dll"
          & ODBC/windows/install.ps1 -DriverPath $driver -Encryption NONE

      - name: Wait for CubeSQL ${{ matrix.name }} service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name "cubesql.exe"
          if ($service.Status -ne "Running") {
              Start-Service -Name "cubesql.exe"
          }

          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
              $service.Refresh()
              if ($service.Status -eq "Stopped") {
                  throw "CubeSQL service stopped before accepting connections"
              }
              if (Test-NetConnection 127.0.0.1 -Port 4430 -InformationLevel Quiet `
                      -WarningAction SilentlyContinue) {
                  exit 0
              }
              Start-Sleep -Milliseconds 250
          }
          throw "CubeSQL service did not accept connections on port 4430"

      - name: Enable Windows crash dumps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dumpDir = Join-Path $env:RUNNER_TEMP "cubesql-odbc-${{ matrix.name }}-dumps"
          $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\cubesql_odbc_smoke.exe"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -PropertyType ExpandString `
              -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -PropertyType DWord `
              -Value 2 -Force | Out-Null
          "CUBESQL_ODBC_DUMP_PATH=$dumpDir\cubesql_odbc_smoke.dmp" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run smoke test through Windows Driver Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = Resolve-Path `
              "${{ matrix.build_dir }}/Release/cubesql_odbc_smoke.exe"
          $process = Start-Process -FilePath $executable -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
              Start-Sleep -Seconds 2
              throw "ODBC smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Upload crash diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cubesql-odbc-windows-${{ matrix.name }}-diagnostics
          path: |
            ${{ runner.temp }}/cubesql-odbc-${{ matrix.name }}-dumps
            ${{ matrix.build_dir }}/Release/*.pdb
            ${{ matrix.build_dir }}/Release/cubesql_odbc_smoke.exe
            ${{ matrix.build_dir }}/Release/cubesqlodbc.dll
          if-no-files-found: warn
          retention-days: 7

      - name: Disable Windows crash dumps
        if: always()
        shell: pwsh
        run: |
          $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\cubesql_odbc_smoke.exe"
          Remove-Item -Path $dumpKey -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package tested driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "cubesql-odbc-windows-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "${{ matrix.build_dir }}/Release/cubesqlodbc.dll" $package
          Copy-Item ODBC/windows/install.ps1 $package
          Copy-Item ODBC/windows/uninstall.ps1 $package
          Copy-Item ODBC/README.md $package
          Copy-Item LICENSE $package

          $hash = (Get-FileHash -Algorithm SHA256 `
              (Join-Path $package "cubesqlodbc.dll")).Hash.ToLowerInvariant()
          "$hash  cubesqlodbc.dll" | Set-Content `
              (Join-Path $package "SHA256SUMS.txt") -Encoding ascii

      - name: Upload tested ${{ matrix.name }} driver
        uses: actions/upload-artifact@v7
        with:
          name: cubesql-odbc-windows-${{ matrix.name }}
          path: ${{ runner.temp }}/cubesql-odbc-windows-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Uninstall CubeSQL server
        if: always()
        shell: pwsh
        run: |
          if ($env:CUBESQL_SERVER_MSI) {
              $msiArgs = @("/x", $env:CUBESQL_SERVER_MSI, "/qn", "/norestart")
              $result = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
              if ($result.ExitCode -notin @(0, 1605, 3010)) {
                  Write-Warning "CubeSQL MSI uninstall failed with exit $($result.ExitCode)"
              }
          }

      - name: Unregister ODBC driver
        if: always()
        shell: pwsh
        run: '& ODBC/windows/uninstall.ps1 -Architecture "${{ matrix.registry_arch }}"'

  release:
    name: Publish permanent ODBC release
    if: startsWith(github.ref, 'refs/tags/odbc-v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested Windows packages
        uses: actions/download-artifact@v8
        with:
          pattern: cubesql-odbc-windows-*
          path: dist

      - name: Create versioned release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#odbc-v}"
          for arch in x86 x64; do
              package="dist/cubesql-odbc-windows-$arch"
              test -f "$package/cubesqlodbc.dll"
              archive="cubesql-odbc-${version}-windows-${arch}.zip"
              (cd "$package" && zip -9 -r "../../$archive" .)
          done
          sha256sum cubesql-odbc-*-windows-*.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#odbc-v}"
          assets=(
              "cubesql-odbc-${version}-windows-x86.zip"
              "cubesql-odbc-${version}-windows-x64.zip"
              "SHA256SUMS.txt"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
          else
              gh release create "$tag" "${assets[@]}" \
                  --verify-tag \
                  --generate-notes \
                  --title "CubeSQL ODBC ${version}"
          fi
